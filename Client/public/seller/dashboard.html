    <main class="dashboard-page">
        <section class="add-property-section">
            <h1 class="section-title">Add New Property</h1>

            <form class="property-form" >
                <div class="form-row">
                    <div class="form-group">
                        <label for="title" class="form-label">Property Title</label>
                        <input type="text" id="title" name="title" class="form-input"
                            placeholder="Modern Downtown Apartment" required>
                    </div>

                    <div class="form-group">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" id="location" name="location" class="form-input"
                            placeholder="Downtown, New York" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="price" class="form-label">Price</label>
                        <input type="number" id="price" name="price" class="form-input" placeholder="450000" required>
                    </div>

                    <div class="form-group">
                        <label for="type" class="form-label">Property Type</label>
                        <select id="type" name="type" class="form-input" required>
                            <option value="">Select Type</option>
                            <option value="apartment">Apartment</option>
                            <option value="house">House</option>
                            <option value="condo">Condo</option>
                            <option value="townhouse">Townhouse</option>
                            <option value="villa">Villa</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="beds" class="form-label">Beds</label>
                        <input type="number" id="beds" name="beds" class="form-input" placeholder="4">
                    </div>

                    <div class="form-group">
                        <label for="baths" class="form-label">Baths</label>
                        <input type="number" id="baths" name="bath" class="form-input" placeholder="4">
                    </div>

                    <div class="form-group">
                        <label for="size" class="form-label">Size</label>
                        <input type="number" id="size" name="size" class="form-input" placeholder="4000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagefile" class="form-label">Property Image</label>
                    <input type="file" id="imagefile" name="imagefile" class="form-input" accept="image/*" required multiple>
                </div>

                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" name="description" class="form-input textarea"
                        placeholder="Describe your property..." rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Add Property</button>
            </form>
        </section>
